<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Assessment Portal</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--card); border-radius: 12px; margin-bottom: 24px; border: 1px solid #334155; }
    .status-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--success); font-weight: 600; }
    .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .quiz-card { background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .q-number { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
    .q-text { font-size: 18px; line-height: 1.5; margin-bottom: 20px; font-weight: 600; }
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .option-item { background: #0f172a; border: 1px solid #334155; padding: 14px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .option-item:hover { border-color: var(--accent); }

    .proctor-panel { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid #334155; height: fit-content; }
    .cam-box { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; position: relative; border: 2px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .warning-banner { margin-top: 14px; padding: 12px; border-radius: 8px; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); font-size: 12px; color: #fca5a5; display: none; }
    
    #startModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-box { background: var(--card); padding: 32px; border-radius: 16px; max-width: 420px; width: 90%; border: 1px solid #334155; text-align: center; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="startModal">
    <div class="modal-box">
      <h2>Assessment Verification</h2>
      <p style="color:#94a3b8; font-size:14px; margin-top:8px;">Enter details to initialize AI live proctoring</p>
      <input type="text" id="stuName" placeholder="Full Name" value="Student A">
      <input type="text" id="stuRoll" placeholder="Roll Number" value="ROLL-1024">
      <button class="btn" onclick="startExam()">Enable Camera & Start</button>
    </div>
  </div>

  <div class="topbar">
    <div><strong>Safalta Assessment Portal</strong></div>
    <div class="status-badge">
      <div class="status-dot"></div> Live Monitoring Active
    </div>
  </div>

  <div class="main-grid">
    <div class="quiz-card">
      <div class="q-number">Question 1 of 10</div>
      <div class="q-text">Which of the following is the fundamental unit of electrical resistance in the SI system?</div>
      <div class="options-list">
        <label class="option-item"><input type="radio" name="q1"> Ampere</label>
        <label class="option-item"><input type="radio" name="q1"> Ohm</label>
        <label class="option-item"><input type="radio" name="q1"> Volt</label>
        <label class="option-item"><input type="radio" name="q1"> Watt</label>
      </div>
    </div>

    <div class="proctor-panel">
      <div class="cam-box">
        <video id="webcam" autoplay playsinline muted></video>
      </div>
      <div id="warnBox" class="warning-banner">⚠️ Suspicious activity recorded and reported to proctors.</div>
    </div>
  </div>

  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <script>
    const ADMIN_ROOM_ID = 'safalta-proctor-admin-main';
    let studentData = { name: '', roll: '' };
    let lastAlertTime = 0;
    const COOLDOWN_MS = 8000;

    async function startExam() {
      studentData.name = document.getElementById('stuName').value.trim();
      studentData.roll = document.getElementById('stuRoll').value.trim();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { max: 15 } },
          audio: false
        });

        document.getElementById('webcam').srcObject = stream;
        document.getElementById('startModal').style.display = 'none';

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        connectToAdminStream(stream);
        setupAntiCheatListeners();
      } catch (err) {
        alert("Camera permission is required to attempt this assessment.");
      }
    }

    function connectToAdminStream(stream) {
      const peer = new Peer();
      peer.on('open', () => {
        peer.call(ADMIN_ROOM_ID, stream, {
          metadata: { name: studentData.name, roll: studentData.roll }
        });
      });
    }

    function setupAntiCheatListeners() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) triggerAlert("Tab switched / Window minimized");
      });

      window.addEventListener("blur", () => {
        triggerAlert("Window lost focus (multitasking detected)");
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) triggerAlert("Exited fullscreen mode");
      });
    }

    async function triggerAlert(reason) {
      const now = Date.now();
      if (now - lastAlertTime < COOLDOWN_MS) return;
      lastAlertTime = now;

      const warnBox = document.getElementById('warnBox');
      warnBox.style.display = 'block';
      setTimeout(() => { warnBox.style.display = 'none'; }, 4000);

      const video = document.getElementById('webcam');
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = 480;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 480, 360);
      const imageData = canvas.toDataURL('image/jpeg', 0.5);

      try {
        await fetch('/api/alert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentName: studentData.name,
            rollNo: studentData.roll,
            reason: reason,
            image: imageData
          })
        });
      } catch (e) {
        console.error("Alert dispatch failed", e);
      }
    }
  </script>
</body>
</html>
