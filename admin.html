<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safalta Proctor - Live Invigilation Grid</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151e2e;
      --border: #23324a;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
    .title-box h1 { font-size: 20px; font-weight: 700; }
    .badge { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

    .student-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.2s, border-color 0.2s; }
    .student-card:hover { transform: translateY(-2px); border-color: var(--accent); }

    .video-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .live-tag { position: absolute; top: 10px; right: 10px; background: rgba(239, 68, 68, 0.85); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px; }

    .student-info { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
    .student-name { font-size: 14px; font-weight: 600; }
    .student-roll { font-size: 12px; color: #94a3b8; }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748b; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-box">
      <h1>Admin Live Invigilation Dashboard</h1>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">P2P Low-Latency WebRTC Stream</p>
    </div>
    <div class="badge">
      <div class="dot"></div> Active Candidates: <span id="count">0</span>
    </div>
  </div>

  <div class="grid" id="videoGrid">
    <div class="empty-state" id="emptyMsg">
      Awaiting candidate connections... Cameras will automatically appear here when students start the exam.
    </div>
  </div>

  <script>
    const ROOM_ID = 'safalta-proctor-admin-main';
    const peer = new Peer(ROOM_ID);
    const grid = document.getElementById('videoGrid');
    const emptyMsg = document.getElementById('emptyMsg');
    const countDisplay = document.getElementById('count');
    const activeStreams = new Map();

    peer.on('open', (id) => {
      console.log('Admin Signaling Ready with ID:', id);
    });

    peer.on('call', (call) => {
      call.answer(); // Admin receives 1-way student video

      const meta = call.metadata || {};
      const candidateName = meta.name || 'Candidate';
      const candidateRoll = meta.roll || 'ID: Unassigned';

      call.on('stream', (remoteStream) => {
        if (activeStreams.has(call.peer)) return;
        activeStreams.set(call.peer, call);

        emptyMsg.style.display = 'none';
        createVideoCard(call.peer, remoteStream, candidateName, candidateRoll);
        updateCount();
      });

      call.on('close', () => {
        removeVideoCard(call.peer);
      });
    });

    function createVideoCard(peerId, stream, name, roll) {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.id = `card-${peerId}`;

      card.innerHTML = `
        <div class="video-wrapper">
          <video autoplay playsinline muted></video>
          <div class="live-tag">LIVE</div>
        </div>
        <div class="student-info">
          <div>
            <div class="student-name">${name}</div>
            <div class="student-roll">${roll}</div>
          </div>
        </div>
      `;

      card.querySelector('video').srcObject = stream;
      grid.appendChild(card);
    }

    function removeVideoCard(peerId) {
      const card = document.getElementById(`card-${peerId}`);
      if (card) card.remove();
      activeStreams.delete(peerId);
      updateCount();
      if (activeStreams.size === 0) emptyMsg.style.display = 'block';
    }

    function updateCount() {
      countDisplay.innerText = activeStreams.size;
    }
  </script>
</body>
</html>
